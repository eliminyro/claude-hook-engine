name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # The same three commands release.yml runs, but before the merge
      # rather than after the tag.
      - name: Build, vet and test
        run: |
          go build ./...
          go vet ./...
          go test ./...
