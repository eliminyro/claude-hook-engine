name: release

# A merge touching what ships runs `ci release`: CHANGELOG.md commit + annotated
# tag, pushed with the deploy key master's ruleset lets through. That tag push
# starts this workflow again, and the tag run builds and publishes.
on:
  push:
    branches:
      - master
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cut:
    if: github.ref_type == 'branch' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # The ci binary is static, so it runs here and pushes over the checkout's
      # deploy-key SSH setup. No GH_TOKEN in its env: that would push over HTTPS.
      - name: Fetch ci from the ci-tool image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          id=$(docker create ghcr.io/eliminyro/ci-tool:latest)
          docker cp "$id:/usr/local/bin/ci" "$RUNNER_TEMP/ci"
          docker rm "$id" >/dev/null

      - name: Cut release
        run: '"$RUNNER_TEMP/ci" release'

  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # A tag on a broken tree must not produce a release.
      - name: Build and test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Cross-build stamped binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for platform in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/claude-hook-engine_${os}_${arch}" \
              ./cmd
          done

      - name: Checksums
        run: cd dist && sha256sum claude-hook-engine_* > checksums.txt

      # ci release annotates its tags with the changelog entry; a hand-made
      # lightweight tag has none, so GitHub generates the notes instead.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=--generate-notes
          [ "$(git cat-file -t "$TAG")" = tag ] && notes=--notes-from-tag
          gh release create "$TAG" dist/* --title "$TAG" "$notes"
